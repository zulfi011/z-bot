# Local only: run the whole app against a pretend Binance wallet (real prices, fake money).
#   docker compose -f docker-compose.yml -f devtools/docker-compose.fake-binance.yml up -d --build
# Never use this on the trading server.
services:
  fake-binance:
    image: python:3.12-slim
    command: ["python", "/fake/fake_binance.py"]
    environment:
      FAKE_USDT: "300"
      FAKE_BNB: "0.02"
    volumes:
      - ./devtools/fake_binance.py:/fake/fake_binance.py:ro
    restart: unless-stopped
  api:
    environment:
      BINANCE_API_URL: http://fake-binance:9000
      BINANCE_API_KEY: fake-key
      BINANCE_API_SECRET: fake-secret
    depends_on:
      fake-binance:
        condition: service_started
  worker:
    environment:
      BINANCE_API_URL: http://fake-binance:9000
      BINANCE_API_KEY: fake-key
      BINANCE_API_SECRET: fake-secret
    depends_on:
      fake-binance:
        condition: service_started
