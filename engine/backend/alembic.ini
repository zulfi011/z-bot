[alembic]
script_location = migrations
# history/ holds every step since the first release; versions/ holds new ones. An empty database skips both and
# loads migrations/schema.sql instead (see migrations/env.py).
version_locations = %(here)s/migrations/history %(here)s/migrations/versions
path_separator = space
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

